# Generated from the D3.6 GeoPackage v2.5; see note.
scheme: KNOWING D3.6 Four-Tier Weighted Similarity (GeoPackage v2.5)
note: T2 and T4 weights were recovered from the published precomputed_scores by non-negative
  least squares (exact for all four CICs at NUTS-3). Indicators linked to all four
  CICs carry weight 4, CIC-specific indicators weight 1, which matches one row per
  (indicator, CIC) link in the scoring query. T1 weights follow the same pattern (climate
  1, terrain 4, categorical 1; DEGURBA and urban type contribute nothing); the Köppen
  partial distance is inferred (identical 0, two of three letters 0.25, same main
  group 0.6, otherwise 1). Class limits follow the published scores (TRF1 >= 80, ...).
  A tier without any value for a pair has distance 1 (as in the published scores).
tier_weights:
  default:
    T1: 0.4
    T2: 0.25
    T3: 0.15
    T4: 0.2
  equal:
    T1: 0.25
    T2: 0.25
    T3: 0.25
    T4: 0.25
  domain_primacy:
    T1: 0.25
    T2: 0.4
    T3: 0.15
    T4: 0.2
trf_classes:
- - TRF1
  - 80.0
- - TRF2
  - 60.0
- - TRF3
  - 40.0
- - TRF4
  - 20.0
- - TRF5
  - -1000000000.0
