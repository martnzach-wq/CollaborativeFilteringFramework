[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "regsim"
version = "0.8.0"
description = "Similarity and prediction for multi-level regional indicators"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "numpy>=1.26", "scipy>=1.11", "pandas>=2.1", "pyarrow>=14", "duckdb>=1.0",
  "scikit-learn>=1.4", "matplotlib>=3.8", "pyyaml>=6", "pydantic>=2.5", "requests>=2.31", "typer>=0.12",
  "openpyxl>=3.1",
  "torch>=2.2",  # decision D6
]

[project.optional-dependencies]
geo = ["geopandas>=0.14", "shapely>=2"]
viz = ["plotly>=5.18", "umap-learn>=0.5"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
app = ["dash>=2.16", "plotly>=5.18"]  # decision D7
dev = [
  "pytest>=8", "ruff>=0.4", "pre-commit>=3", "shapely>=2", "plotly>=5.18", "fastapi>=0.110", "uvicorn>=0.29",
  "httpx>=0.27", "dash>=2.16",
]

[project.scripts]
regsim = "regsim.api.cli:app"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["reference"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "NPY"]
ignore = ["E501"]  # line length is left to the formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: long-running tests"]
