registry_version: knowing_v1
# Coping-type shares of the KNOWING Climate Impact Coping Typology (D1.3; survey November 2023): national samples
# of six countries (NUTS-0) and the settlement-type columns used for the demonstrators (NUTS-3; decision D54).
# Behaviour metadata for transfer and lens construction; values are shares (0-1) and sum to one per region.
indicators:
- indicator_id: coping_share_a
  label: "coping-type share A (Active Antagonists)"
  dtype: continuous
  transform: identity
  aggregation: wmean_pop
  native_levels: [0, 3]
  unit: share
  temporal: static
  tags: [behaviour, coping_typology]
  source:
    connector: table
    dataset: configs/data/coping_types_knowing.csv
