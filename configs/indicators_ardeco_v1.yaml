# JRC ARDECO series used as fallback where Eurostat has no value (decision D5). Agreement with Eurostat,
# 2018-2022, NUTS 2024: SNPTN identical; SUVGDP median ratio 1.000 (Spearman 0.999); RPECNP median ratio 0.991
# at NUTS-2 (Spearman 0.985). `source.levels` limits the NUTS levels an entry may fill.
registry_version: ardeco_v1
population_fallback:
  connector: ardeco
  dataset: SNPTN
  filters: {unit: NR, sex: TOTAL, age: TOTAL}
indicators:
- indicator_id: ardeco_gdp_pps_hab
  label: GDP per inhabitant (PPS), ARDECO
  dtype: continuous
  transform: log
  aggregation: wmean_pop
  native_levels: [3]
  same_as: gdp_pps_hab
  source:
    connector: ardeco
    dataset: SUVGDP
    filters: {unit: PPS_EU27_2020}
    levels: [0, 1, 2, 3]
- indicator_id: ardeco_employment_rate
  label: employment rate 20-64, ARDECO
  dtype: continuous
  transform: identity
  aggregation: wmean_pop
  native_levels: [2, 3]
  same_as: employment_rate
  note: NUTS-3 values are experimental ARDECO estimates
  source:
    connector: ardeco
    dataset: RPECNP
    filters: {unit: PC, sex: TOTAL}
    levels: [0, 1, 2, 3]
